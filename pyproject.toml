[project]
name = "live-coding-gym"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pyyaml", "pytest", "pandas", "numpy"]

[tool.uv]
default-groups = ["dev", "ml"]

[dependency-groups]
dev = ["httpx"]
ml = ["scikit-learn"]  # for the scikit-learn exercises; left out of the Vercel build to stay under its size limit
tools = [
    "alembic>=1.20.1",
    "cryptography<45",
    "mlflow-skinny>=3.18.0",
    "prometheus-client>=0.26.0",
    "sqlalchemy>=2.1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures"]
