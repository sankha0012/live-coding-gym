<style>
/* Layout: a training console. Sticky top bar with sections; main column with a task panel beside an editor that stacks on phones. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --sunk: #e8ecea;
  --ink: #17201d;
  --muted: #5b6863;
  --line: #d3dad7;
  --accent: #0f7a63;
  --accent-ink: #ffffff;
  --accent-soft: #d8efe8;
  --amber: #b45f06;
  --amber-soft: #fbe9d2;
  --good: #1d7a3a;
  --good-soft: #dcf1e2;
  --bad: #b3261e;
  --bad-soft: #f8dedb;
  --code-bg: #1b2422;
  --code-ink: #e3ece8;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --surface: #18211e; --sunk: #0d1311; --ink: #e4ebe8; --muted: #95a39e; --line: #2b3733;
  --accent: #3fc3a0; --accent-ink: #06231b; --accent-soft: #163a31; --amber: #f0a650; --amber-soft: #3b2a14;
  --good: #5fd283; --good-soft: #15321f; --bad: #ff8a80; --bad-soft: #3d1b18; --code-bg: #0b100f; --code-ink: #dbe6e1;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111816; --surface: #18211e; --sunk: #0d1311; --ink: #e4ebe8; --muted: #95a39e; --line: #2b3733;
  --accent: #3fc3a0; --accent-ink: #06231b; --accent-soft: #163a31; --amber: #f0a650; --amber-soft: #3b2a14;
  --good: #5fd283; --good-soft: #15321f; --bad: #ff8a80; --bad-soft: #3d1b18; --code-bg: #0b100f; --code-ink: #dbe6e1;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; padding: 6px 12px; border-radius: 6px; font-size: 14px; }
nav.tabs a:hover { color: var(--ink); background: var(--sunk); }
nav.tabs a.on { color: var(--accent-ink); background: var(--accent); }
.engine { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; gap: 10px; }
.engine span::before { content: "●"; margin-right: 4px; color: var(--amber); }
.engine span.ready::before { color: var(--good); }
.engine span.fail::before { color: var(--bad); }

main { padding-block: 24px 64px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 22px; font-weight: 800; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 68ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

button, .btn { font: inherit; font-weight: 500; font-size: 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { color: var(--ink); background: var(--sunk); }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.routine { list-style: none; padding: 0; margin: 0; counter-reset: r; display: flex; flex-direction: column; gap: 8px; }
.routine li { counter-increment: r; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: baseline; }
.routine li::before { content: counter(r); font-family: var(--mono); font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 50%; width: 22px; height: 22px; display: inline-grid; place-items: center; }
.routine b { font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.path { display: flex; flex-direction: column; gap: 6px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-decoration: none; color: inherit; }
.path:hover { border-color: var(--accent); }
.path .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* learn */
.learn { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; }
.toc { position: sticky; top: 72px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.toc button { text-align: left; border: 0; background: transparent; color: var(--muted); padding: 6px 10px; }
.toc button.on { color: var(--ink); background: var(--accent-soft); font-weight: 600; }
.lesson { max-width: 78ch; display: flex; flex-direction: column; gap: 14px; }
.lesson ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
pre.code.wrap { white-space: pre-wrap; }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); font-family: var(--mono); font-size: 13px; line-height: 1.55; padding: 14px 16px; border-radius: 8px; overflow-x: auto; white-space: pre; }
code { font-family: var(--mono); font-size: 0.92em; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
pre code { background: none; padding: 0; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; width: 100%; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
td { font-variant-numeric: tabular-nums; }
.say { border-left: 3px solid var(--amber); background: var(--amber-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-style: italic; }

/* drills */
.drills { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; }
.dlist { display: flex; flex-direction: column; gap: 14px; align-self: start; position: sticky; top: 72px; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 4px; }
.dgroup { display: flex; flex-direction: column; gap: 2px; }
.dgroup .label { padding: 0 10px 4px; }
.ditem { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: center; text-align: left; border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; color: var(--ink); font-size: 14px; }
.ditem:hover { background: var(--sunk); }
.ditem.on { background: var(--accent-soft); font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dot.done { background: var(--good); border-color: var(--good); }
.work { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.task { display: flex; flex-direction: column; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.pill.py { background: var(--accent-soft); color: var(--accent); }
.pill.sql { background: var(--amber-soft); color: var(--amber); }
.pill.pd { background: var(--sunk); color: var(--ink); }
.pt { font-size: 16px; }
.en { color: var(--muted); font-size: 13px; }
details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details > summary { cursor: pointer; padding: 8px 12px; font-weight: 500; font-size: 14px; }
details > div { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.editor { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
textarea.code { width: 100%; min-height: 300px; resize: vertical; background: var(--code-bg); color: var(--code-ink); font-family: var(--mono); font-size: 13.5px; line-height: 1.55; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; tab-size: 4; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
textarea.code:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.out { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 64px; max-height: 340px; overflow: auto; }
.out .err { color: var(--bad); }
.out .ok { color: var(--good); }
.out .muted { color: var(--muted); }
.out table { font-size: 12px; width: auto; }
.verdict { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
.verdict.pass { background: var(--good-soft); color: var(--good); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); }
.stdinrow { display: flex; flex-direction: column; gap: 4px; }
input.stdin { font-family: var(--mono); font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); width: 100%; }
.kbd { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.checklist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.checklist label { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }

/* mock */
.mockbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.timer { font-family: var(--mono); font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); min-width: 5ch; }
.timer.low { color: var(--amber); }
.timer.over { color: var(--bad); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps button { font-size: 12px; padding: 4px 10px; border-radius: 999px; }
.steps button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.mocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.mockcard { display: flex; flex-direction: column; gap: 8px; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.mockcard .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.mockcard .grow { flex: 1; }
.rubric { display: flex; flex-direction: column; gap: 12px; }
.rubric .ritem { display: grid; grid-template-columns: minmax(120px, 160px) 1fr; gap: 12px; align-items: start; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font-size: 13px; text-align: left; max-width: 240px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* cards */
.flash { max-width: 680px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px; min-height: 220px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.card .front { font-family: var(--display); font-size: 22px; font-weight: 600; }

.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
.note { font-size: 13px; color: var(--muted); }

@media (max-width: 900px) {
  header.top { position: static; }
  .hero, .learn, .drills, .work { grid-template-columns: minmax(0, 1fr); }
  .toc, .dlist { position: static; max-height: none; flex-direction: row; flex-wrap: wrap; }
  .dlist { flex-direction: column; }
  .rubric .ritem { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script type="text/python" id="pyrunner">
import sys, json
from browser import window

class _Out:
    def __init__(self, kind):
        self.kind = kind
    def write(self, s):
        window.pyWrite(str(s), self.kind)
    def flush(self):
        pass

def _close(a, b):
    if isinstance(a, bool) or isinstance(b, bool):
        return a == b
    if isinstance(a, (int, float)) and isinstance(b, (int, float)):
        return abs(a - b) <= 1e-6 + 1e-9 * abs(b)
    if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
        return len(a) == len(b) and all(_close(x, y) for x, y in zip(a, b))
    if isinstance(a, dict) and isinstance(b, dict):
        return set(a.keys()) == set(b.keys()) and all(_close(a[k], b[k]) for k in a)
    return a == b

def run(code, checks_json, stdin=None):
    sys.stdout = _Out("out")
    sys.stderr = _Out("err")
    ns = {"__name__": "__main__"}
    if stdin is not None:
        ns["input"] = lambda prompt="": stdin
    res = {"ok": True, "error": None, "checks": []}
    try:
        exec(code, ns)
    except BaseException as e:
        res["ok"] = False
        try:
            import traceback
            tb = traceback.format_exc()
        except Exception:
            tb = ""
        res["error"] = type(e).__name__ + ": " + str(e)
        res["trace"] = tb
        return json.dumps(res)
    for expr, want in json.loads(checks_json):
        item = {"expr": expr, "want": want}
        try:
            got = eval(expr, ns)
            item["got"] = repr(got)
            item["pass"] = bool(_close(got, eval(want, ns)))
        except BaseException as e:
            item["got"] = type(e).__name__ + ": " + str(e)
            item["pass"] = False
        res["checks"].append(item)
    return json.dumps(res)

def run_io(code, cases_json):
    import io
    res = {"ok": True, "error": None, "checks": []}
    for stdin, want in json.loads(cases_json):
        buf = io.StringIO()
        sys.stdout = buf
        sys.stderr = buf
        ns = {"__name__": "__main__", "input": (lambda s: (lambda prompt="": s))(stdin)}
        item = {"expr": "input: " + stdin, "want": want}
        try:
            exec(code, ns)
            got = buf.getvalue().strip()
            item["got"] = got if got else "(nothing printed)"
            item["pass"] = got == want
        except BaseException as e:
            item["got"] = type(e).__name__ + ": " + str(e)
            item["pass"] = False
        res["checks"].append(item)
    sys.stdout = _Out("out")
    sys.stderr = _Out("err")
    return json.dumps(res)

window.pyRun = run
window.pyRunIO = run_io
window.pyReady()
</script>

<script>
/* ---------------- storage (per-browser convenience only) ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("lcg." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("lcg." + k, JSON.stringify(v)); } catch (e) {} }
};
const state = {
  solved: store.get("solved", {}),
  drafts: store.get("drafts", {}),
  mocks: store.get("mocks", []),
  cards: store.get("cards", {}),
  drill: store.get("drill", null),
  lesson: store.get("lesson", "routine"),
};
const save = () => { store.set("solved", state.solved); store.set("drafts", state.drafts); store.set("mocks", state.mocks); store.set("cards", state.cards); store.set("drill", state.drill); store.set("lesson", state.lesson); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = s => document.querySelector(s);

/* ---------------- engines ---------------- */
const engine = { py: false, pyFail: false, sql: false, db: null };
let outSink = null;
window.pyWrite = (s, kind) => { if (outSink) outSink(s, kind); };
window.pyReady = () => { engine.py = true; const e = $("#eng-py"); e.textContent = "Python ready"; e.className = "ready"; refreshRunButtons(); };
function startPython() {
  try { new Function("return 1")(); } catch (e) { markPyFail("Python blocked here"); return; }
  if (typeof brython !== "function") { markPyFail("Python failed to load"); return; }
  try { brython({ debug: 0, ids: ["pyrunner"] }); } catch (e) { markPyFail("Python failed to start"); }
  setTimeout(() => { if (!engine.py) markPyFail("Python failed to start"); }, 20000);
}
function markPyFail(msg) { if (engine.py) return; engine.pyFail = true; const e = $("#eng-py"); e.textContent = msg; e.className = "fail"; refreshRunButtons(); }

/* seeded data for SQL drills: a small food-delivery marketplace */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buildDB(SQL) {
  const rnd = mulberry32(2026);
  const pick = (arr, w) => { if (!w) return arr[Math.floor(rnd() * arr.length)]; let r = rnd(), c = 0; for (let i = 0; i < arr.length; i++) { c += w[i]; if (r < c) return arr[i]; } return arr[arr.length - 1]; };
  const db = new SQL.Database();
  db.run(`CREATE TABLE restaurants (restaurant_id INTEGER PRIMARY KEY, name TEXT, city TEXT, cuisine TEXT);
          CREATE TABLE orders (order_id INTEGER PRIMARY KEY, customer_id INTEGER, restaurant_id INTEGER, courier_id INTEGER,
            created_at TEXT, subtotal REAL, delivery_fee REAL, coupon_code TEXT, status TEXT, promised_minutes INTEGER, actual_minutes REAL);`);
  const cities = ["Sao Paulo", "Rio de Janeiro", "Belo Horizonte", "Curitiba"];
  const cuisines = ["japanese", "pizza", "brazilian", "burger", "healthy", "arabic"];
  const rs = db.prepare("INSERT INTO restaurants VALUES (?,?,?,?)");
  const rcity = [];
  for (let i = 1; i <= 24; i++) { const c = pick(cities, [0.4, 0.25, 0.2, 0.15]); rcity[i] = c; rs.run([i, "Rest " + String(i).padStart(2, "0"), c, cuisines[(i * 7) % 6]]); }
  rs.free();
  const os = db.prepare("INSERT INTO orders VALUES (?,?,?,?,?,?,?,?,?,?,?)");
  const start = Date.UTC(2026, 7, 1);
  db.run("BEGIN");
  for (let i = 0; i < 1500; i++) {
    const t = new Date(start + Math.floor(rnd() * 92 * 24 * 60) * 60000);
    const ts = t.toISOString().slice(0, 19).replace("T", " ");
    const rid = 1 + Math.floor(rnd() * rnd() * 24 + rnd() * 6) % 24;
    const status = rnd() < 0.08 ? "cancelled" : "delivered";
    const promised = pick([30, 40, 50]);
    const slow = (rid % 5 === 0) ? 1.25 : 1.0;
    let actual = status === "delivered" ? Math.round(promised * slow * Math.exp((rnd() + rnd() + rnd() - 1.5) * 0.35) * 10) / 10 : null;
    let subtotal = Math.round((20 + rnd() * 60 + rnd() * rnd() * 120) * 100) / 100;
    if (rnd() < 0.01) subtotal = null;
    const coupon = pick([null, "BEMVINDO10", "FRETEGRATIS", "PIZZA20"], [0.7, 0.1, 0.15, 0.05]);
    os.run([100001 + i, 1 + Math.floor(rnd() * rnd() * 400), rid, status === "delivered" ? 1 + Math.floor(rnd() * 80) : null, ts, subtotal, pick([0, 4.99, 6.99, 8.99]), coupon, status, promised, actual]);
  }
  db.run("COMMIT");
  os.free();

}
function startSQL() {
  const e = $("#eng-sql");
  if (typeof initSqlJs !== "function") { e.textContent = "SQL failed to load"; e.className = "fail"; return; }
  initSqlJs().then(SQL => { engine.db = buildDB(SQL); engine.sql = true; e.textContent = "SQL ready"; e.className = "ready"; refreshRunButtons(); })
    .catch(() => { e.textContent = "SQL failed to start"; e.className = "fail"; });
}
function sqlExec(q) { const r = engine.db.exec(q); if (!r.length) return { columns: [], values: [] }; return r[r.length - 1]; }
function tableHTML(res, max = 50) {
  if (!res.columns.length) return '<span class="muted">(no rows)</span>';
  const rows = res.values.slice(0, max).map(r => "<tr>" + r.map(v => `<td>${v === null ? '<span class="muted">NULL</span>' : esc(typeof v === "number" && !Number.isInteger(v) ? +v.toFixed(4) : v)}</td>`).join("") + "</tr>").join("");
  return `<div class="tablewrap"><table><thead><tr>${res.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>` + (res.values.length > max ? `<div class="muted">… ${res.values.length - max} more rows (${res.values.length} total)</div>` : `<div class="muted">${res.values.length} row(s)</div>`);
}
function sameCell(a, b) {
  if (a === null || b === null) return a === b;
  if (typeof a === "number" && typeof b === "number") return Math.abs(a - b) <= 0.006 + 1e-3 * Math.abs(b);
  return String(a) === String(b);
}
function compareSQL(got, want, ordered) {
  if (got.columns.length !== want.columns.length) return `Expected ${want.columns.length} column(s) (${want.columns.join(", ")}), got ${got.columns.length}.`;
  if (got.values.length !== want.values.length) return `Expected ${want.values.length} row(s), got ${got.values.length}.`;
  let g = got.values, w = want.values;
  if (!ordered) { const k = r => JSON.stringify(r.map(v => typeof v === "number" ? Math.round(v * 100) / 100 : v)); g = [...g].sort((a, b) => k(a) < k(b) ? -1 : 1); w = [...w].sort((a, b) => k(a) < k(b) ? -1 : 1); }
  for (let i = 0; i < w.length; i++) for (let j = 0; j < w[i].length; j++) if (!sameCell(g[i][j], w[i][j])) return `Row ${i + 1}, column ${j + 1}: expected ${w[i][j]}, got ${g[i][j]}.` + (ordered ? " Check the ORDER BY too." : "");
  return null;
}

def validate(row, schema):
    clean, issues = {}, []
    for name, (typ, lo, hi, default) in schema.items():
        v = row.get(name)
        if v is None or (isinstance(v, float) and math.isnan(v)):
            clean[name] = default
            issues.append("missing:" + name)
            continue
        try:

class CircuitBreaker:
    def __init__(self, max_failures=3, cooldown=30, clock=None):

        self.cooldown = cooldown
        self.clock = clock or time.time
        self.failures = 0
        self.opened_at = None

    solution: `import math

def check_batch(values, ref_mean, ref_std, max_null_rate=0.05, z=3.0):
    if not values:
        return ["empty"]
    valid = [v for v in values if v is not None and not math.isnan(v)]

  { id: "cb-movavg", track: "cb", title: "Moving average", mins: 8,

    io: [["3 1 2 3 4 5", "2.00,3.00,4.00"], ["2 10 20", "15.00"], ["5 1 2", "none"]],
    hint: "parts = s.split(); k = int(parts[0]); values = [float(x) for x in parts[1:]]. Format with f'{v:.2f}'.",
    solution: `def MovingAverage(s):
    parts = s.split()

    starter: `import math

def top_k(query, docs, k):

`,
    checks: [["top_k([1, 0], {'a': [1, 0], 'b': [0, 1], 'c': [1, 1]}, 2)", "['a', 'c']"], ["top_k([1, 1], {'x': [0, 0], 'y': [2, 2]}, 5)", "['y']"], ["top_k([0, 1], {}, 3)", "[]"]],
    hint: "dot = sum(x * y for x, y in zip(a, b)); norm = math.sqrt(sum(x * x for x in a)). Build a list of (score, id), then sorted(..., key=lambda t: (-t[0], t[1])).",
    solution: `import math

def top_k(query, docs, k):
    def norm(v):
        return math.sqrt(sum(x * x for x in v))
    qn = norm(query)
    scored = []
    for doc_id, vec in docs.items():

def _run(fails, tries):

    pt: "Write prf(y, p, t): y are 0/1 labels, p are scores, predict 1 when p >= t. Return (precision, recall, f1). Any division by zero gives 0.0.",
    en: "Threshold choice for an imbalanced classifier.",
    starter: `def prf(y, p, t):

    checks: [["prf([1, 0, 1, 0], [0.9, 0.8, 0.4, 0.1], 0.5)", "(0.5, 0.5, 0.5)"], ["prf([0, 0], [0.1, 0.2], 0.5)", "(0.0, 0.0, 0.0)"], ["prf([1, 1, 0], [0.9, 0.7, 0.2], 0.5)", "(1.0, 1.0, 1.0)"]],
    hint: "Count tp, fp, fn in one loop. precision = tp / (tp + fp), recall = tp / (tp + fn), f1 = 2PR / (P + R), each guarded against zero.",
    solution: `def prf(y, p, t):
    tp = fp = fn = 0
    for yi, pi in zip(y, p):

  { id: "st-auc", track: "st", title: "AUC by hand", mins: 10,
    pt: "y (0/1) and score. AUC = probability that a random positive scores higher than a random negative; a tie counts 1/2.",
    en: "AUC as a pairwise probability (Mann–Whitney).",
    starter: `def auc(y, s):
    pass
`,
    checks: [["auc([0, 0, 1, 1], [0.1, 0.2, 0.8, 0.9])", "1.0"], ["auc([0, 1], [0.5, 0.5])", "0.5"], ["round(auc([0, 1, 0, 1, 1], [0.3, 0.6, 0.7, 0.8, 0.2]), 4)", "0.5"]],
    hint: "Split scores into positives and negatives, loop over all pairs, count wins + 0.5 * ties, divide by n_pos * n_neg.",
    solution: `def auc(y, s):
    pos = [si for yi, si in zip(y, s) if yi == 1]
    neg = [si for yi, si in zip(y, s) if yi == 0]
    wins = 0.0
    for p in pos:

`, say: "This version is O(n_pos * n_neg). Using ranks (Mann-Whitney U) gives O(n log n). And AUC doesn't change under monotone transforms of the score." },

    hint: "p = (x1 + x2) / (n1 + n2); se = sqrt(p(1−p)(1/n1 + 1/n2)); z = (p2 − p1) / se",

    pt: "y (1 = defaulted) and score. KS = the largest gap between the cumulative score distributions of goods and bads, evaluated at each score value.",
    en: "Kolmogorov–Smirnov statistic.",
    starter: `def ks(y, s):

`,
    checks: [["ks([0, 0, 1, 1], [0.1, 0.2, 0.8, 0.9])", "1.0"], ["round(ks([0, 1, 0, 1], [0.1, 0.2, 0.3, 0.4]), 4)", "0.5"]],

  { id: "robust", title: "1b · Robust ML systems", html: `
<p class="lede">What the iFood round tests: code around a model that stays correct when data is messy and dependencies fail. Before saying "done", walk this list out loud.</p>
<div class="tablewrap"><table><thead><tr><th>Concern</th><th>What to do in code</th><th>Drill</th></tr></thead><tbody>
<tr><td>Bad input</td><td>Validate schema, types, ranges; treat None and NaN as missing; repair with defaults and record every repair</td><td>Validate a feature row</td></tr>
<tr><td>Model errors</td><td>try/except per row, check outputs with math.isfinite, fallback values, track the fallback rate</td><td>Batch predictions</td></tr>
<tr><td>Dependency down</td><td>Timeouts, retries with backoff for transient errors only, circuit breaker, safe default</td><td>Circuit breaker · Retry with backoff</td></tr>
<tr><td>Determinism</td><td>No random without a seed, no reliance on set order, full sort keys with tie-breaks, md5 not hash(), inject the clock</td><td>Deterministic split · Bug hunt</td></tr>
<tr><td>Duplicates and order</td><td>Idempotent processing: dedupe by id, last-write-wins by (timestamp, id)</td><td>Idempotent events</td></tr>
<tr><td>Silent failure</td><td>Count and alert: null rate, fallback rate, mean shift, PSI</td><td>Alert on a broken feed · PSI</td></tr>
<tr><td>Side effects</td><td>Don't mutate inputs; return new objects; pure functions are easy to test</td><td>Bug hunt</td></tr>
<tr><td>Proof</td><td>Small asserts for the happy path and each edge case, written before you say done</td><td>Every drill</td></tr>
</tbody></table></div>
<div class="say">Before I call this done, let me check: what happens with a missing value, a NaN, an empty batch, the model throwing, the same event twice, and two runs in a row?</div>` },

  { id: "sql", title: "4 · SQL", html: `
<p class="lede">Fifteen moves. The SQL drills run for real against a small delivery database in your browser.</p>
<pre class="code">SELECT city, COUNT(*) AS n, AVG(x) AS avg_x
FROM orders o
JOIN restaurants r ON r.restaurant_id = o.restaurant_id
WHERE o.status = 'delivered'        -- rows, before grouping
GROUP BY city
HAVING COUNT(*) &gt;= 100              -- groups, after grouping
ORDER BY n DESC LIMIT 10;

AVG(CASE WHEN status = 'cancelled' THEN 1.0 ELSE 0 END)     -- a rate
WITH rev AS (...) SELECT ... FROM rev                        -- name your steps
ROW_NUMBER() OVER (PARTITION BY city ORDER BY revenue DESC)  -- top N per group
LAG(orders) OVER (ORDER BY month)                            -- previous row
SUM(gmv) OVER (PARTITION BY customer_id ORDER BY created_at) -- running total

WHERE id NOT IN (SELECT ...)  /  LEFT JOIN b ... WHERE b.id IS NULL</pre>

  { id: "patterns", title: "5 · Algorithm patterns", html: `
<p class="lede">No dynamic programming needed for a data round. These six cover the “algorithm live coding” type.</p>

<p class="lede">Interviewers plant these on purpose. Calling one out earns points.</p>

  { id: "ai", title: "8 · Prompting while they watch", html: `
<p class="lede">At iFood you may use your own AI assistant, and the interviewer grades your prompts. A good prompt is a spec: it shows you understood the problem before the AI wrote anything.</p>
<h3>The five-part prompt</h3>
<ol class="routine">
<li><span><b>Context.</b> What the code is for and the shape of the inputs and outputs.</span></li>
<li><span><b>Exact behaviour.</b> The signature and a rule for every edge case: missing, NaN, empty, ties, errors.</span></li>
<li><span><b>Constraints.</b> Python 3.11, standard library only (or which libraries), deterministic, don't mutate inputs, keep it short.</span></li>
<li><span><b>Tests.</b> "Then write asserts for: …" listing the cases you care about.</span></li>
<li><span><b>Scope.</b> One function at a time. Never "build the whole thing".</span></li>
</ol>
<h3>Weak vs strong</h3>
<pre class="code wrap">Weak:   write a function to clean the input data for the model

Strong: Write validate(row, schema) in Python 3.11, standard library only. schema maps field -> (type, min, max, default).
        Missing/None/NaN -> default and record "missing:&lt;field&gt;"; unconvertible -> default and "bad_type:&lt;field&gt;";
        out of range -> clip and "clipped:&lt;field&gt;". Don't modify the input. Return (clean_row, sorted(issues)).
        Then write 3 asserts: a clean row, a row with every problem, and a NaN.</pre>
<h3>After the answer comes back</h3>
<ol class="routine">
<li><span><b>Read it aloud before pasting.</b> Say what each block does.</span></li>
<li><span><b>Run the tests.</b> Add one edge case the AI didn't think of.</span></li>
<li><span><b>When it's wrong, say why and re-prompt with the failing case</b> ("this fails when the prediction is 0.0 because of 'if not pred'; fix only that"). Catching an AI bug is the best signal you can give.</span></li>
<li><span><b>Simplify.</b> Delete anything you can't explain. You'll be asked to explain every line.</span></li>
</ol>
<p>Every "Robust ML systems" drill has an example prompt. Write yours first, then compare.</p>` },

const VIEWS = ["home", "learn", "drills", "mock", "cards", "progress"];
function route() {
  let v = (location.hash || "#home").slice(1);
  if (!VIEWS.includes(v)) v = "home";
  VIEWS.forEach(x => { $("#v-" + x).hidden = x !== v; });
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  ({ home: renderHome, learn: renderLearn, drills: renderDrills, mock: renderMock, cards: renderCards, progress: renderProgress })[v]();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
function go(v) { if (location.hash === "#" + v) route(); else location.hash = v; }

/* ---------------- learn ---------------- */
function renderLearn() {
  const cur = LESSONS.find(l => l.id === state.lesson) || LESSONS[0];
  $("#v-learn").innerHTML = `<div class="learn"><nav class="toc">${LESSONS.map(l => `<button data-l="${l.id}" class="${l.id === cur.id ? "on" : ""}">${l.title}</button>`).join("")}</nav>
  <article class="lesson"><h1>${cur.title.replace(/^\d+b? · /, "")}</h1>${cur.html}
  <div class="row"><button class="primary" id="l-next">${LESSONS.indexOf(cur) < LESSONS.length - 1 ? "Next lesson" : "Go to drills"}</button></div></article></div>`;
  document.querySelectorAll(".toc button").forEach(b => b.onclick = () => { state.lesson = b.dataset.l; save(); renderLearn(); window.scrollTo(0, 0); });
  $("#l-next").onclick = () => { const i = LESSONS.indexOf(cur); if (i < LESSONS.length - 1) { state.lesson = LESSONS[i + 1].id; save(); renderLearn(); window.scrollTo(0, 0); } else go("drills"); };
}

/* ---------------- shared task + editor widget ---------------- */
function refreshRunButtons() {
  document.querySelectorAll("[data-run]").forEach(b => {
    const d = DRILLS.find(x => x.id === b.dataset.run);
    if (!d) return;
    const ready = d.track === "sql" ? engine.sql : engine.py;
    b.disabled = !ready;
  });
  document.querySelectorAll("[data-engine-note]").forEach(n => {
    const d = DRILLS.find(x => x.id === n.dataset.engineNote);
    const ready = d.track === "sql" ? engine.sql : engine.py;
    const failed = d.track === "sql" ? $("#eng-sql").className === "fail" : engine.pyFail;
    n.hidden = ready;
    n.textContent = failed ? "The code runner couldn't start in this browser. You can still write your answer and compare it with the model answer." : "Loading the code runner…";
  });
}
function taskHTML(d, opts = {}) {
  const pillCls = { prod: "py", cb: "py", ai: "py", py: "py", dbg: "py", st: "py", sql: "sql", pd: "pd" }[d.track];
  return `<div class="task">
    <div class="row"><span class="pill ${pillCls}">${TRACKS[d.track]}</span><span class="pill">~${d.mins} min</span>${state.solved[d.id] ? '<span class="pill py">done</span>' : ""}</div>
    <h2>${esc(d.title)}</h2>
    <p class="pt">${esc(d.pt)}</p>
    <p class="en">${esc(d.en)}</p>
    ${d.track === "sql" ? `<details${opts.schemaOpen ? " open" : ""}><summary>Tables</summary><div><pre class="code">${esc(SCHEMA)}</pre><div class="row"><button data-peek="orders">Preview orders</button><button data-peek="restaurants">Preview restaurants</button></div></div></details>` : ""}
    ${d.track === "pd" ? `<details open><summary>What a good answer covers</summary><div><ul class="checklist">${d.keys.map((k, i) => `<li><label><input type="checkbox" id="k-${d.id}-${i}"> ${esc(k)}</label></li>`).join("")}</ul></div></details>` : ""}
    ${d.hint ? `<details><summary>Hint</summary><div><p>${esc(d.hint)}</p></div></details>` : ""}
    ${d.prompt ? `<details><summary>Example prompt for your AI assistant</summary><div><pre class="code wrap">${esc(d.prompt)}</pre><p class="note">They will read your prompt. Write yours first, then compare: did you state the inputs, every edge case, the constraints and the tests?</p></div></details>` : ""}
    <details id="sol-${d.id}"><summary>Model answer</summary><div><pre class="code">${esc(d.solution || d.ref)}</pre>${d.say ? `<div class="say">${esc(d.say)}</div>` : ""}</div></details>
  </div>`;
}
function editorHTML(d) {
  const draft = state.drafts[d.id] ?? (d.starter || "# Write your pandas answer here, from memory.\n# Then open 'Model answer' and compare.\n\n");
  const isPd = d.track === "pd";
  return `<div class="editor">
    <textarea class="code" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor">${esc(draft)}</textarea>
    <div class="row">
      ${isPd ? `<button class="primary" id="b-compare">Compare with model answer</button><button id="b-selfok">Mark as done</button>` :
      `<button class="primary" id="b-check" data-run="${d.id}">Run and check</button>${d.track === "sql" ? "" : `<button id="b-run" data-run="${d.id}">Run only</button>`}`}
      <button class="ghost" id="b-reset">Reset</button>
      <span class="kbd">${isPd ? "" : "Ctrl/⌘ + Enter runs and checks · Tab indents"}</span>
    </div>
    ${d.io ? `<label class="stdinrow" for="stdin"><span class="label">Input (what input() returns)</span><input id="stdin" class="stdin" spellcheck="false" autocomplete="off" value="${esc(state.drafts[d.id + ":stdin"] ?? d.io[0][0])}"></label>` : ""}
    ${isPd ? "" : `<p class="note" data-engine-note="${d.id}" hidden></p>`}
    <div class="out" id="out" aria-live="polite"><span class="muted">${isPd ? "pandas can't run in the browser. Type it, compare, and tick what you covered." : "Output appears here."}</span></div>
  </div>`;
}
function wireEditor(d, onSolved) {
  const ed = $("#ed"), out = $("#out");
  ed.addEventListener("input", () => { state.drafts[d.id] = ed.value; save(); });
  ed.addEventListener("keydown", e => {
    if (e.key === "Tab") { e.preventDefault(); const s = ed.selectionStart, en = ed.selectionEnd; ed.value = ed.value.slice(0, s) + "    " + ed.value.slice(en); ed.selectionStart = ed.selectionEnd = s + 4; state.drafts[d.id] = ed.value; save(); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const b = $("#b-check"); if (b && !b.disabled) b.click(); }
  });
  $("#b-reset").onclick = () => { delete state.drafts[d.id]; delete state.drafts[d.id + ":stdin"]; save(); ed.value = d.starter || ""; out.innerHTML = '<span class="muted">Reset to the starting code.</span>'; };
  document.querySelectorAll("[data-peek]").forEach(b => b.onclick = () => { if (!engine.sql) return; out.innerHTML = tableHTML(sqlExec(`SELECT * FROM ${b.dataset.peek} LIMIT 8`)); });
  const solved = () => { state.solved[d.id] = Date.now(); save(); onSolved && onSolved(); };
  if (d.track === "pd") {
    $("#b-compare").onclick = () => { $("#sol-" + d.id).open = true; out.innerHTML = `<span class="muted">Compare line by line. Different syntax is fine if the logic matches. Tick the points you covered, then mark it done.</span>`; };
    $("#b-selfok").onclick = () => { solved(); out.innerHTML = '<div class="verdict pass">Marked as done</div>'; };
    return;
  }
  if (d.track === "sql") {
    $("#b-check").onclick = () => {
      let got;
      try { got = sqlExec(ed.value); } catch (e) { out.innerHTML = `<div class="err">SQL error: ${esc(e.message)}</div><span class="muted">Read the message: it usually names the column or keyword it didn't expect.</span>`; return; }
      const want = sqlExec(d.ref);
      const diff = compareSQL(got, want, d.ordered);
      out.innerHTML = (diff ? `<div class="verdict fail">Not yet. ${esc(diff)}</div>` : `<div class="verdict pass">Correct. Same result as the reference query.</div>`) + tableHTML(got, 20);
      if (!diff) solved();
    };
    return;
  }
  const run = withChecks => {
    if (!engine.py) return;
    out.innerHTML = "";
    const buf = [];
    outSink = (s, kind) => buf.push(kind === "err" ? `<span class="err">${esc(s)}</span>` : esc(s));
    let res;
    try {
      if (d.io && withChecks) res = JSON.parse(window.pyRunIO(ed.value, JSON.stringify(d.io)));
      else res = JSON.parse(window.pyRun(withChecks && d.pre ? ed.value + "\n\n" + d.pre : ed.value, JSON.stringify(withChecks ? d.checks : []), d.io ? $("#stdin").value : null));
    }
    catch (e) { res = { ok: false, error: String(e && e.message || e), checks: [] }; }
    outSink = null;
    let html = buf.length ? `<div>${buf.join("")}</div>` : "";
    if (!res.ok) { html = `<div class="err">${esc(res.error)}</div>` + html + `<span class="muted">Read the last line of the error first: it names what went wrong.</span>`; out.innerHTML = html; return; }
    if (withChecks) {
      const pass = res.checks.filter(c => c.pass).length, all = res.checks.length;
      const rows = res.checks.map(c => `<div class="${c.pass ? "ok" : "err"}">${c.pass ? "✓" : "✗"} ${esc(c.expr)}${c.pass ? "" : `\n    expected ${esc(c.want)}\n    got      ${esc(c.got)}`}</div>`).join("");
      html = (pass === all ? `<div class="verdict pass">All ${all} checks pass</div>` : `<div class="verdict fail">${pass} of ${all} checks pass</div>`) + rows + (html ? `<div class="muted">printed output:</div>` + html : "");
      if (pass === all) solved();
    } else if (!html) html = '<span class="muted">Ran without errors. Nothing was printed.</span>';
    out.innerHTML = html;
  };
  if (d.io) $("#stdin").addEventListener("input", e => { state.drafts[d.id + ":stdin"] = e.target.value; save(); });
  $("#b-check").onclick = () => run(true);
  $("#b-run").onclick = () => run(false);
}

/* ---------------- drills view ---------------- */
function renderDrills() {
  const d = DRILLS.find(x => x.id === state.drill) || DRILLS[0];
  state.drill = d.id;
  const groups = Object.keys(TRACKS).map(t => `<div class="dgroup"><span class="label">${TRACKS[t]}</span>${DRILLS.filter(x => x.track === t).map(x => `<button class="ditem ${x.id === d.id ? "on" : ""}" data-d="${x.id}"><span class="dot ${state.solved[x.id] ? "done" : ""}"></span>${esc(x.title)}</button>`).join("")}</div>`).join("");
  const idx = DRILLS.indexOf(d);
  $("#v-drills").innerHTML = `<div class="drills"><aside class="dlist">${groups}</aside>
    <div class="stack"><div class="work">${taskHTML(d)}${editorHTML(d)}</div>
    <div class="row"><button class="ghost" id="d-prev" ${idx === 0 ? "disabled" : ""}>Previous</button><button id="d-next" ${idx === DRILLS.length - 1 ? "disabled" : ""}>Next drill</button></div></div></div>`;
  document.querySelectorAll(".ditem").forEach(b => b.onclick = () => { state.drill = b.dataset.d; save(); renderDrills(); });
  $("#d-prev").onclick = () => { state.drill = DRILLS[idx - 1].id; save(); renderDrills(); };
  $("#d-next").onclick = () => { state.drill = DRILLS[idx + 1].id; save(); renderDrills(); };
  wireEditor(d, () => document.querySelector(`.ditem[data-d="${d.id}"] .dot`)?.classList.add("done"));
  refreshRunButtons();
}

/* ---------------- mock view ---------------- */
let mock = null, timerId = null;
function renderMock() {
  if (!mock) {
    $("#v-mock").innerHTML = `<div class="stack"><span class="label">Timed mock interview</span><h1>Pick a round and start the clock.</h1>
      <p class="lede">Simulate the real thing: talk out loud, no AI, and only official docs for syntax lookups (say it before you look). Tap the routine steps as you do them. At the end you score yourself.</p></div>
      <div class="mocks">${MOCKS.map(m => `<div class="mockcard"><h3>${m.title}</h3><span class="meta">${m.mins} min · ${m.drills ? m.drills.length : 4} tasks</span><p class="grow">${m.blurb}</p><button class="primary" data-m="${m.id}">Start</button></div>`).join("")}</div>
      <p class="note">Want a live interviewer? Say “mock 1” (or any round) in the Claude thread and Claude will run it with you as the interviewer.</p>`;
    document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => startMock(b.dataset.m));
    return;
  }
  if (mock.finished) return renderRubric();
  const d = DRILLS.find(x => x.id === mock.drills[mock.i]);
  $("#v-mock").innerHTML = `<div class="mockbar"><div class="stack" style="gap:2px"><span class="label">${esc(mock.title)} · task ${mock.i + 1} of ${mock.drills.length}</span><div class="timer" id="timer"></div></div>
    <div class="steps" id="steps">${STEPS.map(s => `<button data-s="${s}" class="${mock.steps[mock.i]?.includes(s) ? "on" : ""}">${s}</button>`).join("")}</div>
    <div class="row" style="margin-left:auto"><button id="m-next">${mock.i < mock.drills.length - 1 ? "Next task" : "Finish and score"}</button><button class="ghost" id="m-quit">Quit</button></div></div>
    <div class="work">${taskHTML(d)}${editorHTML(d)}</div>`;
  document.querySelectorAll("#steps button").forEach(b => b.onclick = () => { const arr = mock.steps[mock.i] = mock.steps[mock.i] || []; const k = arr.indexOf(b.dataset.s); k >= 0 ? arr.splice(k, 1) : arr.push(b.dataset.s); b.classList.toggle("on"); });
  $("#m-next").onclick = () => { if (mock.i < mock.drills.length - 1) { mock.i++; renderMock(); window.scrollTo(0, 0); } else { mock.finished = true; mock.elapsed = Math.round((Date.now() - mock.start) / 1000); clearInterval(timerId); renderRubric(); } };
  $("#m-quit").onclick = () => { clearInterval(timerId); mock = null; renderMock(); };
  // keep the model answer closed unless they open it on purpose; note it
  document.querySelector(`#sol-${d.id} summary`).textContent = "Model answer (opening it counts as a hint)";
  wireEditor(d, () => { mock.solved.add(d.id); });
  refreshRunButtons();
  tick();
}
function startMock(id) {
  const m = MOCKS.find(x => x.id === id);
  let drills = m.drills;
  if (!drills) { const pool = DRILLS.filter(runnable).map(x => x.id); drills = []; while (drills.length < 4) { const p = pool[Math.floor(Math.random() * pool.length)]; if (!drills.includes(p)) drills.push(p); } }
  mock = { id, title: m.title, mins: m.mins, drills, i: 0, start: Date.now(), steps: {}, solved: new Set(), scores: {}, finished: false };
  drills.forEach(x => delete state.drafts[x]); save();
  clearInterval(timerId); timerId = setInterval(tick, 1000);
  renderMock();
}
function tick() {
  const el = $("#timer"); if (!el || !mock) return;
  const left = mock.mins * 60 - Math.round((Date.now() - mock.start) / 1000);
  const a = Math.abs(left), t = `${left < 0 ? "+" : ""}${Math.floor(a / 60)}:${String(a % 60).padStart(2, "0")}`;
  el.textContent = t; el.className = "timer" + (left < 0 ? " over" : left < 300 ? " low" : "");
}
function renderRubric() {
  const solvedN = mock.drills.filter(x => mock.solved.has(x)).length;
  const routineN = mock.drills.reduce((s, _, i) => s + (mock.steps[i]?.length || 0), 0);
  $("#v-mock").innerHTML = `<div class="stack"><span class="label">${esc(mock.title)} · finished</span><h1>Score yourself honestly.</h1>
    <p class="lede">${solvedN} of ${mock.drills.length} tasks passed the checks, in ${Math.floor(mock.elapsed / 60)} min ${mock.elapsed % 60} s (limit ${mock.mins} min). You marked ${routineN} routine steps out of ${mock.drills.length * 6}.</p></div>
    <div class="panel rubric">${RUBRIC.map(([name, opts], ri) => `<div class="ritem"><b>${name}</b><div class="seg">${opts.map((o, oi) => `<button data-r="${ri}" data-v="${oi * 2}" class="${mock.scores[ri] === oi * 2 ? "on" : ""}">${oi * 2} · ${o}</button>`).join("")}</div></div>`).join("")}
    <label class="stack" style="gap:6px" for="m-notes"><b>What did you have to look up, and where did the logic slip?</b><textarea id="m-notes" class="code" style="min-height:90px;font-family:var(--body)"></textarea></label>
    <div class="row"><button class="primary" id="m-save">Save to progress</button><span class="note" id="m-total"></span></div></div>`;
  const total = () => { const v = Object.values(mock.scores); $("#m-total").textContent = v.length === 5 ? `Total ${v.reduce((a, b) => a + b, 0)} / 20 · 16+ ready · 12–15 redo in 2 days · under 12 redo the lesson first` : `${v.length} of 5 scored`; };
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { mock.scores[b.dataset.r] = +b.dataset.v; document.querySelectorAll(`[data-r="${b.dataset.r}"]`).forEach(x => x.classList.toggle("on", x === b)); total(); });
  total();
  $("#m-save").onclick = () => {
    const v = Object.values(mock.scores);
    state.mocks.unshift({ at: Date.now(), title: mock.title, score: v.length === 5 ? v.reduce((a, b) => a + b, 0) : null, passed: solvedN, of: mock.drills.length, secs: mock.elapsed, notes: $("#m-notes").value });
    save(); mock = null; go("progress");
  };
}

/* ---------------- cards view ---------------- */
let cardIdx = null, cardShown = false;
function nextCard() {
  const due = CARDS.map((c, i) => i).sort((a, b) => (state.cards[a]?.box || 0) - (state.cards[b]?.box || 0) || (state.cards[a]?.at || 0) - (state.cards[b]?.at || 0));
  const low = due.filter(i => (state.cards[i]?.box || 0) === (state.cards[due[0]]?.box || 0));
  cardIdx = low[Math.floor(Math.random() * low.length)]; cardShown = false;
}
function renderCards() {
  if (cardIdx === null) nextCard();
  const [front, back] = CARDS[cardIdx];
  const known = CARDS.filter((_, i) => (state.cards[i]?.box || 0) >= 2).length;
  $("#v-cards").innerHTML = `<div class="flash"><span class="label">Recall cards · ${known} of ${CARDS.length} solid</span>
    <h1>Say it, type it, then flip.</h1><p class="lede">The goal isn't perfect syntax. It's having a first version ready in your head so you start typing instead of freezing.</p>
    <div class="card"><div class="label">${esc(front.split(" · ")[0])}</div><div class="front">${esc(front.split(" · ").slice(1).join(" · "))}</div>
    ${cardShown ? `<pre class="code">${esc(back)}</pre>` : `<textarea class="code" id="c-try" style="min-height:70px" placeholder="Type your version (optional)" aria-label="Your version"></textarea>`}</div>
    <div class="row">${cardShown ? `<button id="c-again">Again</button><button class="primary" id="c-good">I knew it</button>` : `<button class="primary" id="c-flip">Show answer</button>`}<button class="ghost" id="c-skip">Skip</button></div></div>`;
  if (cardShown) {
    const mark = up => { const c = state.cards[cardIdx] || { box: 0 }; c.box = up ? Math.min(4, (c.box || 0) + 1) : 0; c.at = Date.now(); state.cards[cardIdx] = c; save(); nextCard(); renderCards(); };
    $("#c-again").onclick = () => mark(false); $("#c-good").onclick = () => mark(true);
  } else $("#c-flip").onclick = () => { cardShown = true; renderCards(); };
  $("#c-skip").onclick = () => { nextCard(); renderCards(); };
}

/* ---------------- progress view ---------------- */
function renderProgress() {
  const rows = Object.keys(TRACKS).map(t => { const all = DRILLS.filter(d => d.track === t); const k = all.filter(d => state.solved[d.id]).length; return `<tr><td>${TRACKS[t]}</td><td>${k} / ${all.length}</td><td style="width:40%"><div class="bar"><i style="width:${100 * k / all.length}%"></i></div></td></tr>`; }).join("");
  const mocks = state.mocks.length ? `<div class="tablewrap panel"><table><thead><tr><th>Date</th><th>Round</th><th>Score</th><th>Tasks passed</th><th>Time</th><th>Notes</th></tr></thead><tbody>${state.mocks.map(m => `<tr><td>${new Date(m.at).toLocaleDateString("en-GB")}</td><td>${esc(m.title)}</td><td>${m.score == null ? "–" : m.score + " / 20"}</td><td>${m.passed} / ${m.of}</td><td>${Math.round(m.secs / 60)} min</td><td>${esc(m.notes || "")}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">No mocks yet. Your scores and notes appear here after you finish one.</div>`;
  $("#v-progress").innerHTML = `<span class="label">Progress · saved in this browser</span><h1>Where you are</h1>
    <div class="tablewrap panel"><table><thead><tr><th>Track</th><th>Done</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <h2>Mock history</h2>${mocks}
    <div class="row"><button class="ghost" id="p-reset">Clear all progress</button><span class="note" id="p-confirm"></span></div>`;
  $("#p-reset").onclick = function () {
    if (this.dataset.armed) { state.solved = {}; state.drafts = {}; state.mocks = []; state.cards = {}; save(); renderProgress(); }
    else { this.dataset.armed = "1"; this.textContent = "Click again to clear everything"; }
  };
}

/* ---------------- boot ---------------- */
route();
startSQL();
if (document.readyState === "complete") startPython(); else window.addEventListener("load", startPython);
</script>
