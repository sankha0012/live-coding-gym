- id: mf6-c-10
  front: |
    ```python
    edges = np.quantile(baseline, np.linspace(0, 1, 11))
    b = np.histogram(baseline, edges)[0]
    c = np.histogram(current, edges)[0]
    ```

    What does this do?
  back: |
    It builds ten bins from the baseline's deciles and counts how many baseline and current values fall in each. Fixing the edges from the baseline is essential for PSI, because edges recomputed on new data would hide a shift. Values outside the baseline range are dropped unless the end edges are set to infinity.
