title: "Explain: token bucket rate limiter"
kind: explain
required: true
rubric:
  - "It says what the code does: limits calls to a steady rate while allowing short bursts up to a capacity."
  - "It explains how: tokens refill with elapsed time times rate, are capped at capacity, and each call spends tokens."
  - "It gives complexity: O(1) time and O(1) memory per bucket."
  - "It names a risk: it is not thread-safe, and a cost above capacity can never be allowed."
