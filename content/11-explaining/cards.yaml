- id: ex-six-steps
  front: Explain · the six steps for explaining code, in order
  back: |
    1. What it does (input, output, purpose)
    2. How it works (the main idea, the data structure)
    3. Complexity (time and space, say what n is)
    4. Trade-offs (what you chose, what you gave up)
    5. Risks (empty, null, duplicates, failing dependencies)
    6. Next step (test, log, metric, alert)
- id: ex-start-purpose
  front: Explain · where should an explanation of code start, and what should it avoid?
  back: |
    Start with the purpose: input, output and goal in one sentence.
    Do not read the code line by line. The interviewer can read.
- id: ex-name-n
  front: Explain · what is wrong with the answer "it is O(n)"?
  back: |
    It does not say what n is.
    Say "O(n) in the number of rows". If two sizes matter, name both: O(n + m).
- id: ex-say-a-risk
  front: Explain · which habit makes an answer sound senior?
  back: |
    Name one way the code can fail before you are asked.
    Good defaults: ties, nulls, duplicates, empty input, a slow or failing dependency.
- id: ex-ai-ownership
  front: Explain · what do you say when the code came from an AI assistant?
  back: |
    Say so, then show ownership: "I asked for a first version, then I ran it on edge
    cases and simplified it." If you cannot explain a line, simplify it before you submit.
- id: ex-cx-python-structures
  front: Explain · Python cost of list membership, set membership, sort and heap push
  back: |
    x in list      O(n)
    x in set/dict  O(1) on average
    sorted(data)   O(n log n)
    heappush       O(log n)
- id: ex-cx-set-lookup
  front: Explain · turn an O(n * m) membership loop into O(n + m)
  back: |
    sb = set(b)                       # O(m), pays O(m) memory
    [x for x in a if x in sb]         # O(n) lookups
    # trade-off: memory for time
- id: ex-cx-hidden-loops
  front: Explain · which calls inside a loop hide a second loop?
  back: |
    x in some_list, list.remove, list.insert(0, x), sorted(...), str.replace, slicing.
    Each touches the whole input, so the loop becomes O(n squared).
- id: ex-cx-sql-join-sort
  front: Explain · rough cost of a SQL join, ORDER BY and window function
  back: |
    Hash join: about O(n + m). Nested loop without index: O(n * m).
    ORDER BY without index: O(n log n).
    Window with PARTITION BY and ORDER BY: O(n log n), the sort dominates.
    Say "worst case ... usually less with an index".
- id: ex-cx-space-chunks
  front: Explain · what do you say when the data does not fit in memory?
  back: |
    Name the space cost (a set of 80M ids may not fit), then offer a way out:
    process in chunks, stream line by line (O(1) memory), or let the database group by.
- id: ex-cx-stream-lines
  front: Explain · read a big file with O(1) memory
  back: |
    with open(path) as f:
        for line in f:      # one line at a time
            handle(line)
- id: ex-cx-join-string
  front: Explain · build one string from many parts without O(n squared) risk
  back: |
    "".join(parts)    # O(total length)
    # s += part in a loop can copy the string each time
- id: ex-cx-average-worst
  front: Explain · how do you phrase dict lookup cost honestly?
  back: |
    "O(1) on average." Many colliding keys can make it slower.
    sorted() is O(n log n) in the worst case too.
- id: ex-cx-nested-loops
  front: Explain · what is the cost of two nested loops over the same input, and the usual fix?
  back: |
    O(n squared). Too slow at 100,000 items or more.
    Fix: a dict or set for lookups, or sort first and scan once (O(n log n)).
- id: ex-story-project
  front: Explain · order for "tell me about a project"
  back: |
    Problem and why it mattered, your role, one decision and why,
    result with a number, one lesson. About two minutes.
- id: ex-story-bug
  front: Explain · order for "tell me about your hardest bug"
  back: |
    Symptom, how you narrowed it down (two concrete steps), root cause,
    fix, what now prevents it (test, check, alert).
- id: ex-story-weakness
  front: Explain · how to answer "what is your weakness?"
  back: |
    One real weakness in one plain sentence, what you do about it (with a time frame),
    and how you protect the work meanwhile. Not "I am a perfectionist".
- id: ex-story-ai
  front: Explain · four parts of an honest answer on how you use AI assistants
  back: |
    What you use it for, how you verify (read, run, test edge cases),
    what stays your decision, one risk you watch for.
- id: ex-pt-complexity
  front: Explain · in Portuguese, say "it is O(n), where n is the number of rows"
  back: |
    "A complexidade de tempo é O(n), onde n é o número de linhas."
- id: ex-pt-risk-next
  front: Explain · in Portuguese, name a tie risk and a next step
  back: |
    "Se dois eventos tiverem o mesmo timestamp, o resultado depende da ordem de entrada."
    "Com mais tempo, eu adicionaria testes para os casos de borda."
