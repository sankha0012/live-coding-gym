- id: ed-c-01
  front: "MLflow: what does it do and what would you say you used it for?"
  back: "MLflow tracks experiments: parameters, metrics and artifacts (such as a model file) for each run, so results are comparable and reproducible. It also has a model registry for versions and stages. Say which parts you actually used, for example logging runs and comparing them in the UI."
- id: ed-c-02
  front: "Follow-up: how do you make an MLflow run reproducible?"
  back: "Log the parameters, the random seed, the data version or a hash of it, the code version (git commit) and the environment. A metric without the data and code it came from cannot be reproduced."
- id: ed-c-03
  front: "Prometheus: what is it and what do you monitor with it?"
  back: "A time-series monitoring system that scrapes metrics from an HTTP endpoint (usually /metrics) at an interval. For a model service: request count, error count, latency histograms, and model-specific metrics such as prediction score distribution. Alerts are defined on queries (PromQL)."
- id: ed-c-04
  front: "Follow-up: Counter, Gauge or Histogram for request latency?"
  back: "Histogram (or Summary). A Counter only goes up (requests, errors), a Gauge goes up and down (queue length, memory), and a Histogram records observations in buckets so you can estimate percentiles such as p95 across instances."
- id: ed-c-05
  front: "SQLAlchemy: what does it give you over writing raw SQL strings?"
  back: "A Python layer over the database: Core builds SQL with expressions and bound parameters, and the ORM maps tables to classes and manages sessions and transactions. Bound parameters protect against SQL injection. Raw SQL is still possible when it is clearer."
- id: ed-c-06
  front: "Alembic: what is it for?"
  back: "Database schema migrations for SQLAlchemy. Each migration is a versioned script with upgrade and downgrade steps, and the database stores which revision it is on, so schema changes are applied in order and are reviewable."
- id: ed-c-07
  front: "Follow-up: how do you change a column on a live table safely with Alembic?"
  back: "In small backward-compatible steps: add the new nullable column, deploy code that writes both, backfill existing rows, switch reads, and only later drop the old column. A single migration that renames or drops a column breaks the running version of the app."
- id: ed-c-08
  front: "pandas: what is a common performance and correctness trap?"
  back: "Row-by-row loops (iterrows, apply) are slow compared with vectorised operations. On the correctness side, chained indexing can modify a copy (SettingWithCopyWarning), and merges can silently multiply rows when the key is not unique. Check shapes before and after a merge."
- id: ed-c-09
  front: "Follow-up: how do you split time-ordered data in pandas for a model?"
  back: "By time, not randomly: sort by timestamp and train on the earlier part, validate on the later part, so the model never sees the future. A random split leaks information when rows are correlated over time."
- id: ed-c-10
  front: "scikit-learn: why use a Pipeline?"
  back: "It chains preprocessing and the model into one object, so fit only sees training data inside each cross-validation fold, which prevents leakage. It also guarantees that training and serving apply the same transformations, and you can save it as one file."
- id: ed-c-11
  front: "Follow-up: precision vs recall, and how do you choose a threshold?"
  back: "Precision is the share of predicted positives that are correct; recall is the share of actual positives found. Lowering the threshold raises recall and lowers precision. Choose it from the cost of a false positive versus a false negative, using the precision-recall curve on validation data."
- id: ed-c-12
  front: "FastAPI: what is it and why is it a good fit for model serving?"
  back: "A Python web framework built on type hints. Pydantic models validate request and response bodies automatically, it generates OpenAPI docs, and it supports async handlers. Load the model once at startup, not on every request."
- id: ed-c-13
  front: "Follow-up: what would you add to make a FastAPI prediction endpoint robust?"
  back: "Input validation with a Pydantic schema, a health endpoint, timeouts and a fallback if the model fails, structured logging with a request id, and metrics for latency and errors. Keep the model version in the response so results can be traced."
- id: ed-c-14
  front: "Interviewer asks: did you use AI assistance for this project? What is an honest answer?"
  back: "Yes, if you did, and say how: you planned first, asked for small pieces, read and tested every line, and fixed problems yourself. Then be ready to explain any line and defend each choice. Do not claim to have hand-written what you did not, and do not claim to understand what you cannot explain."
