- id: cl-c-01
  front: "What are the steps of the control loop?"
  back: "Plan in comments, ask for one small piece, read every line, run it, explain it to yourself, then make one small change by hand. Then repeat for the next piece."
- id: cl-c-02
  front: "Why write the plan as comments before prompting?"
  back: "The plan is yours. It decides the pieces and their order, so the assistant fills in small blanks instead of designing the solution. It also gives you something to check the answer against."
- id: cl-c-03
  front: "What makes a prompt right-sized?"
  back: "It asks for one function (or one small step), names the inputs and the output, and states the edge cases that matter. If you cannot say what the answer should look like, the ask is too big or too vague."
- id: cl-c-04
  front: "A prompt says: 'solve this Coderbyte task'. What is wrong with it?"
  back: "It hands over the whole design. You cannot check the result against a plan of your own, and you will probably accept code you do not understand. Split it into parse, core logic and output, and ask for one at a time."
- id: cl-c-05
  front: "What do you do right after the assistant returns code?"
  back: "Read it line by line before you run it, and say what each line does. Mark anything you cannot explain, then ask about it or rewrite it."
- id: cl-c-06
  front: "Why run the code even if it looks right?"
  back: "Reading finds what the code says; running finds what it does. A quick run on a normal input and one edge input (empty, one item) catches most mistakes before they spread into the next piece."
- id: cl-c-07
  front: "The assistant's answer is long and does three things. What do you do?"
  back: "Do not accept it as it is. Ask for a smaller piece, or keep only the part you asked for and delete the rest. Code that is not in your plan is code you did not choose."
- id: cl-c-08
  front: "Why make one small change by hand after each piece?"
  back: "It proves you understand the code and keeps you in control. If you can rename a variable, fix a boundary or add a condition yourself, you could defend the line in an interview."
- id: cl-c-09
  front: "What do you put in a prompt to get code in the right format?"
  back: "The function signature, a short example input and the exact expected output. For Coderbyte tasks that includes that the input arrives as text and what type or string the function must return."
- id: cl-c-10
  front: "The assistant's code fails your test. What is the best next prompt?"
  back: "Say what you ran, what you expected and what you got, and point to the line you suspect. Asking for a fix to one named problem works better than pasting the error and asking it to fix everything."
- id: cl-c-11
  front: "How do you check that the assistant's tests are not just agreeing with its code?"
  back: "Write at least one assert yourself from the task statement, before reading the code. Tests derived from the code can share its bugs."
- id: cl-c-12
  front: "When is it fine to type code yourself instead of asking?"
  back: "Whenever it is quicker. A one-line fix, a rename, a changed boundary or a print for debugging is faster by hand, and it keeps you fluent. The assistant is a tool you choose to use."
