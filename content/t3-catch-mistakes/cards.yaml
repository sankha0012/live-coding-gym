- id: cm-c-01
  front: "What is the mutable default argument bug?"
  back: "In def f(x, seen=[]), the default list is created once when the function is defined and shared by every call that omits it. Fix: default to None and create a new list inside the function."
- id: cm-c-02
  front: "Where do off-by-one errors hide in assistant code?"
  back: "In range() and slice ends (the stop is excluded), in loops over chunks (a final partial chunk) and in len(x) - 1 style indices. Check the first and last iteration by hand with a tiny input."
- id: cm-c-03
  front: "Why does an assistant's NaN check like x == float('nan') never work?"
  back: "NaN is not equal to anything, including itself, so the comparison is always False. Use math.isnan(x), or pandas isna for columns."
- id: cm-c-04
  front: "What is wrong with 'except: pass' or 'except Exception: return None'?"
  back: "It swallows errors, so failures look like normal results and the real cause is lost. Catch the specific exception you expect and either handle it visibly or let it propagate."
- id: cm-c-05
  front: "What is data leakage in a sklearn script?"
  back: "Information from the test set influences training, for example fitting a scaler or imputer on all data before train_test_split. Fit transformers on the training part only, ideally inside a Pipeline."
- id: cm-c-06
  front: "What goes wrong with naive datetimes?"
  back: "datetime.now() has no timezone, so ordering it against a timezone-aware value (<, >) raises TypeError and it hides local-time shifts. Use timezone-aware UTC datetimes, for example datetime.now(timezone.utc)."
- id: cm-c-07
  front: "How can assistant code have the wrong time complexity?"
  back: "Typical causes are 'x in list' inside a loop (O(n) each, so O(n^2) overall), repeated list.pop(0) or insert(0, ...) and string concatenation in a loop. A set, dict or deque usually fixes it."
- id: cm-c-08
  front: "What is silently changed behaviour in a proposed edit?"
  back: "A change that does more than you asked: a different sort order or tie rule, a new default, a renamed return key, or a mutated input. Read the diff for everything that changed, not only for what you requested."
- id: cm-c-09
  front: "What is an invented API and how do you catch it?"
  back: "A function, method or parameter that does not exist (or exists only in another version or library). Running the code usually raises AttributeError or TypeError; confirm unfamiliar calls in the documentation."
- id: cm-c-10
  front: "A test fails and the assistant edits the test to make it pass. Accept?"
  back: "Not by default. Ask whether the test or the code was wrong, using the task statement as the judge. Changing an expectation to match the output hides the bug."
- id: cm-c-11
  front: "What is your accept or reject checklist for a proposed change?"
  back: "Does it do what I asked and nothing more? Do I understand every changed line? Does it still pass my tests, and did any test change? Does it change behaviour, types or performance elsewhere? If any answer is no, reject or reduce it."
- id: cm-c-12
  front: "Why is a bigger diff riskier to accept than a small one?"
  back: "Every extra changed line is something you must read, understand and test. Large diffs bury unrelated changes among the requested ones, so ask for small edits that you can review completely."
