- title: Compute precision from predicted positives
  code: |
    def precision(preds, labels):
    -    return sum(preds) / len(preds)
    +    tp = sum(1 for p, y in zip(preds, labels) if p == 1 and y == 1)
    +    predicted_pos = sum(preds)
    +    return tp / predicted_pos if predicted_pos else 0.0
  correct: accept
  why: It fixes the real cause, because precision is true positives over predicted positives, and it guards the zero-denominator case without touching the test.
