- id: pa-states-task
  front: Prompt · what goes in the first sentence?
  back: "The task in one sentence: the function name, the language and the purpose. Example: Write dedupe(events) in Python 3.12 that keeps the latest event per user."
- id: pa-inputs-outputs
  front: Prompt · what must you say about inputs and outputs?
  back: "The signature, the types, and one real example of each. 'Return the result' is not enough: say list, dict or DataFrame."
- id: pa-edge-cases
  front: Prompt · which edge cases do you always name?
  back: "Empty input, missing values, NaN, duplicates, ties and invalid values. Write the rule for each one, so the assistant does not guess."
- id: pa-constraints
  front: Prompt · which constraints do you state?
  back: "Python version, standard library only (or which libraries), deterministic output, do not mutate the input, any time or memory limit."
- id: pa-examples
  front: Prompt · why give examples?
  back: "Two or three input and output pairs remove ambiguity. Include one edge case, such as an empty list."
- id: pa-ask-tests
  front: Prompt · what do you add at the end?
  back: "Ask for tests: 'Then write three asserts: the example, an empty input and the error case.'"
- id: pa-one-function
  front: Prompt · how big should one request be?
  back: "One function at a time. A big answer hides mistakes and you cannot explain it afterwards."
- id: pa-read-every-line
  front: Verify · what is the first step after the answer arrives?
  back: "Read every line and match it to a rule in your prompt. If you cannot explain a line, ask or rewrite it."
- id: pa-own-tests
  front: Verify · why write your own asserts?
  back: "The assistant's tests may be written from its code, so a wrong code and a wrong test agree. Write at least one assert from your own prompt."
- id: pa-three-edges
  front: Verify · which three inputs do you try?
  back: |
    Empty, one item, and a bad value.
        f([])
        f([1])
        f([None])
- id: pa-off-by-one
  front: Verify · the classic range bug in chunking
  back: |
    Stopping early: range(0, len(items) - n, n) loses the last chunk.
    Correct: range(0, len(items), n)
- id: pa-mutable-default
  front: Verify · the mutable default trap
  back: |
    def f(x, seen=[]) shares one list across calls.
    Use seen=None, then: if seen is None: seen = []
- id: pa-nan-compare
  front: Verify · why do NaN filters misbehave?
  back: "nan == nan is False and nan < 1 is False. Test with math.isnan(x) or pandas isna, and decide what NaN should do."
- id: pa-explain-after
  front: Interview · what happens after the code works?
  back: "You explain it without the assistant: what it does, complexity, one edge case, one risk. If you cannot explain a line, you did not finish."
- id: pa-be-honest
  front: Interview · how do you describe your use of the assistant?
  back: "Say what you delegated and what you checked: 'I asked for the first draft, read it, tested three edge inputs and changed the tie rule.'"
- id: pa-ret-type-tie
  front: Prompt · how do you state a tie rule?
  back: "Say it in one clause: 'ties keep the original order' or 'on equal timestamps keep the first event'."
- id: pa-swallowed-exc
  front: Verify · the swallowed exception smell
  back: |
    A bare except hides real failures. Catch the specific error:
        try: ...
        except ValueError: ...
- id: pa-leakage
  front: Verify · the data leakage smell in a split
  back: "Fitting a scaler on all data before the split. Split first, fit on train only, then transform both."
- id: pa-naive-dt
  front: Verify · the naive datetime smell
  back: "Mixing naive and aware datetimes raises TypeError on compare. Use datetime(..., tzinfo=timezone.utc) everywhere."
- id: pa-narrate
  front: Interview · what do you say while you work?
  back: "Narrate: what you ask for, what you check, what you changed and why. Silence makes the interviewer guess."
