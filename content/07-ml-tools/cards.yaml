- id: tl-sklearn-pipeline-why
  front: Why use a scikit-learn Pipeline instead of fitting steps by hand?
  back: |
    It chains preprocessing and the model into one object. fit learns every step on the training data only, so test data never leaks into the scaler or encoder, and one object is saved and served.
- id: tl-sklearn-columntransformer
  front: What does ColumnTransformer do?
  back: |
    It applies different transformers to different columns, for example scaling numeric columns and one-hot encoding categorical ones, then joins the results. It is usually the first step of a Pipeline.
- id: tl-sklearn-fit-vs-transform
  front: Why call fit_transform on train but only transform on test?
  back: |
    The scaler or encoder must learn its statistics (mean, categories) from train only. Calling fit on test data leaks information and makes the score look better than it will be in production.
- id: tl-sklearn-handle-unknown
  front: How does OneHotEncoder handle a category never seen in training?
  back: |
    By default it raises an error at transform time. Set handle_unknown="ignore" so an unseen category is encoded as all zeros in that feature's columns instead of crashing the service.
- id: tl-mlflow-problem
  front: What problem does an experiment tracker solve?
  back: |
    It records parameters, metrics, code version and artifacts for every run. You can compare runs and reproduce the one that produced a given model, instead of guessing from file names.
- id: tl-mlflow-run-contents
  front: What do you typically log in an MLflow run?
  back: |
    Parameters (log_param), metrics (log_metric), and artifacts such as the model file or plots. Also tag the run with the data and code version.
- id: tl-mlflow-registry
  front: What is a model registry?
  back: |
    A central catalogue of model versions with stages or aliases, such as staging and production. It lets serving code ask for the current production model and lets you roll back to an older version.
- id: tl-airflow-dag
  front: What is a DAG in Airflow?
  back: |
    A directed acyclic graph of tasks with dependencies and a schedule. Directed means each edge has a direction, acyclic means no loops, so there is always a valid run order.
- id: tl-airflow-idempotent
  front: Why should a pipeline task be idempotent?
  back: |
    Because orchestrators retry and backfill. If running a task twice gives the same end state (for example overwrite a partition instead of appending), retries cannot create duplicates.
- id: tl-airflow-backfill
  front: What is a backfill?
  back: |
    Running a pipeline for past dates, for example after a bug fix or a new pipeline. It only works safely if tasks depend on the run date, not on the current time.
- id: tl-airflow-orchestrator-vs-compute
  front: What does an orchestrator do, and what does it not do?
  back: |
    It schedules tasks, tracks dependencies, retries and alerts. It should not do heavy computing itself; tasks hand the work to Spark, a container or a warehouse.
- id: tl-docker-image-container
  front: What is the difference between a Docker image and a container?
  back: |
    An image is the read-only package with code, dependencies and a filesystem. A container is a running instance of an image.
- id: tl-docker-why-ml
  front: Why containerize an ML service?
  back: |
    The same image runs on a laptop, in CI and in production, with the same Python and library versions. That removes the works-on-my-machine problem and makes deploys repeatable.
- id: tl-docker-layer-cache
  front: How do you order a Dockerfile to use layer caching well?
  back: |
    Copy the dependency file and install dependencies first, then copy your code. Code changes often, so the slow install layer stays cached.
- id: tl-docker-model-in-image
  front: Should the model file go inside the image or be loaded at start?
  back: |
    Both work. Baking it in gives an immutable, versioned artifact; loading from a registry or storage at start keeps images small and lets you update the model without rebuilding.
- id: tl-fastapi-pydantic
  front: Why validate request bodies with Pydantic models in FastAPI?
  back: |
    It rejects bad input with a clear 422 error before your model code runs. The same types also generate the OpenAPI docs, so the contract is explicit.
- id: tl-fastapi-load-once
  front: Where should a model be loaded in a serving app?
  back: |
    Once at startup, not inside the request handler. Loading per request makes every call slow.
- id: tl-fastapi-health
  front: What are health and readiness endpoints for?
  back: |
    They tell the orchestrator whether the process is alive and whether it is ready to serve, for example the model has loaded. The platform uses them to restart or route traffic.
- id: tl-fs-problem
  front: What problem does a feature store solve?
  back: |
    It gives training and serving the same feature definitions and values. That prevents training-serving skew and lets teams reuse features instead of rewriting them.
- id: tl-fs-online-offline
  front: What are the online and offline stores?
  back: |
    The offline store holds historical feature values for building training sets. The online store holds the latest values in a low-latency database for serving.
- id: tl-fs-point-in-time
  front: What is a point-in-time correct join?
  back: |
    When building training data, each row gets the feature values that were known at that row's timestamp, not later ones. Otherwise future information leaks into training.
- id: tl-fs-skew
  front: What is training-serving skew?
  back: |
    The features differ between training and production, because of different code, different data sources or stale values. The model then performs worse live than in offline tests.
- id: tl-dvc-problem
  front: What problem does DVC solve?
  back: |
    Git cannot hold large data and model files. DVC stores them elsewhere and keeps small pointer files in Git, so each commit ties code to an exact data version.
- id: tl-dvc-pointer
  front: What does Git track when you use DVC?
  back: |
    A small .dvc file or dvc.lock with the content hash of the data. The data itself lives in remote storage and is fetched by hash.
- id: tl-dvc-pipeline
  front: What is a DVC pipeline stage?
  back: |
    A named step with a command, its inputs and its outputs. DVC reruns only the stages whose inputs changed.
- id: tl-dvc-why-hash
  front: Why version data by content hash?
  back: |
    The same bytes give the same hash, so a version is exact and cheap to verify. Any change to the data produces a new identifier.
- id: tl-mon-drift-types
  front: Data drift versus concept drift?
  back: |
    Data drift means the input distribution changes. Concept drift means the relationship between inputs and the target changes, so the same input now deserves a different prediction.
- id: tl-mon-evidently
  front: What is Evidently used for?
  back: |
    An open-source Python library that compares a reference dataset to current data and reports drift, data quality and model performance. It produces reports and test suites.
- id: tl-mon-prometheus
  front: What is Prometheus used for in ML serving?
  back: |
    It scrapes numeric metrics from services over time, such as request count, latency and error rate, and supports alerting. It tracks system health; model quality needs extra metrics.
- id: tl-mon-no-labels
  front: How do you monitor model quality when labels arrive late?
  back: |
    Watch proxies now: input drift, prediction distribution and data quality. Compute real accuracy later, when the labels arrive.
- id: tl-cicd-ml-tests
  front: What tests belong in CI for an ML project?
  back: |
    Unit tests for data and feature code, schema checks, a smoke training run on a tiny seeded sample, and a check that the model beats a minimum metric. All must be deterministic.
- id: tl-cicd-ct
  front: What is continuous training?
  back: |
    Automatically retraining and validating a model on a schedule or when drift or new data triggers it. A new model is promoted only if it passes the checks.
- id: tl-cicd-gate
  front: What is a model quality gate in a pipeline?
  back: |
    An automatic check that blocks promotion if the new model is worse than a threshold or than the current production model on a fixed evaluation set.
- id: tl-cloud-sagemaker
  front: Name the managed ML platforms of the three big clouds.
  back: |
    Amazon SageMaker on AWS, Vertex AI on Google Cloud, and Azure Machine Learning on Azure. All offer training jobs, a model registry and managed endpoints.
- id: tl-cloud-databricks
  front: What is Databricks known for in ML?
  back: |
    A platform built around Spark and a lakehouse, with notebooks, managed MLflow and Delta tables. It fits large data processing together with model training.
- id: tl-cloud-managed-tradeoff
  front: Trade-off of a managed ML platform versus self-hosting?
  back: |
    Managed saves operations work and scales easily, but costs more and ties you to a vendor. Self-hosting gives control and portability but you run everything.
- id: tl-llm-embedding
  front: What is an embedding?
  back: |
    A vector of numbers that represents text, so similar meanings land close together. Closeness is usually measured with cosine similarity.
- id: tl-llm-vectordb
  front: What does a vector database do?
  back: |
    It stores embeddings and finds the nearest ones to a query vector quickly, often with approximate search. It is used to retrieve relevant documents.
- id: tl-llm-rag
  front: What is RAG and why use it?
  back: |
    Retrieval-augmented generation: fetch relevant documents first, then put them in the prompt so the model answers from them. It adds fresh or private knowledge and reduces made-up answers.
- id: tl-llm-eval
  front: How do you evaluate a RAG or LLM system?
  back: |
    Use a fixed set of test questions with expected answers or references. Measure retrieval quality and answer quality separately, and recheck after every prompt or model change.
