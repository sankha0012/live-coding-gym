- q: What is a DAG in an orchestrator such as Airflow?
  options:
  - A database that stores task results
  - A scheduler that runs on every server
  - A directed graph of tasks with dependencies and no cycles
  - A Docker image with all tasks inside
  answer: 2
  why: Tasks are nodes and dependencies are edges, and no cycle means there is always a valid run order.
- q: What does an orchestrator give you that a plain cron job does not?
  options:
  - Dependencies between steps, retries, run history and backfills
  - Faster code
  - Automatic model accuracy
  - A free cloud server
  answer: 0
  why: Cron only starts a command at a time, while an orchestrator manages the whole workflow.
- q: Why should orchestrated tasks be idempotent?
  options:
  - Idempotent tasks run faster
  - Airflow refuses tasks that are not idempotent
  - Retries and backfills run tasks again, and a rerun must not duplicate or corrupt data
  - It lets the task skip logging
  answer: 2
  why: Reruns are normal in orchestration, so each one must leave the same final state as a single run.
- q: A daily task builds its output path from datetime.now(). What goes wrong in a backfill?
  options:
  - Nothing, now() is always correct
  - Every backfilled run writes to today's path instead of the date it is meant for
  - The task fails because now() is not allowed
  - The task runs twice as fast
  answer: 1
  why: Tasks should use the date that the orchestrator passes for the run, so a rerun of an old day is reproducible.
- q: What is a backfill?
  options:
  - Deleting old runs from the history
  - Restoring a server from a backup
  - Filling missing values in a column
  - Running the pipeline for past dates that were missed or need to be recomputed
  answer: 3
  why: Backfills re-create past periods, which only works safely if the tasks are idempotent and date-driven.
- q: Which is a good use of an orchestrator task?
  options:
  - Start a heavy Spark or SQL job and wait for it, while the orchestrator tracks status
  - Load a 50 GB table into the orchestrator's own memory
  - Stream every event of a live system through the scheduler
  - Replace the model server
  answer: 0
  why: Orchestrators coordinate work and should not do the heavy data processing themselves.
- q: What is the difference between a Docker image and a container?
  options:
  - They are two names for the same thing
  - An image is a running process and a container is a file
  - An image is a read-only template, and a container is a running instance of it
  - A container is bigger than an image because it includes the operating system kernel
  answer: 2
  why: You build an image once and start as many containers from it as you need.
- q: In a Dockerfile, why copy requirements.txt and install packages before copying the rest of the code?
  options:
  - Docker only allows one copy command
  - Pip must run before any file exists
  - It makes the image smaller in every case
  - Docker caches layers, so the slow install is reused when only your code changes
  answer: 3
  why: A layer is rebuilt only when its inputs change, so putting stable steps first speeds up rebuilds.
- q: Why package an ML service in a container?
  options:
  - Containers make models more accurate
  - The same environment, with the same library versions, runs on a laptop, in CI and in production
  - Containers remove the need for tests
  - Containers make Python run faster
  answer: 1
  why: A container removes the "works on my machine" gap by shipping the dependencies with the code.
- q: How should an API key reach a containerised service?
  options:
  - Written into the Dockerfile so it is always there
  - Committed in the code next to the model
  - Passed at run time, for example as an environment variable or a secret, and kept out of the image
  - Printed in the logs at start-up
  answer: 2
  why: Anything baked into an image can be read by whoever gets the image.
- q: Why pin library versions, for example scikit-learn==1.5.2, in the requirements of an image?
  options:
  - Unpinned libraries cannot be installed
  - Pinning makes pip faster
  - Pinned versions are always the newest
  - A rebuild next month should give the same behaviour, not a silently updated library
  answer: 3
  why: Reproducible builds need fixed versions, and a saved model can depend on the library version that made it.
- q: A container writes its output files inside its own file system. What happens when the container is removed?
  options:
  - The files are lost unless they were written to a mounted volume or sent to external storage
  - The files move to the image
  - The files are kept on the host automatically
  - The files are uploaded to the registry
  answer: 0
  why: The container file system is temporary, so durable output needs a volume or object storage.
