title: "Explain: what is RAG and how does it fail?"
kind: open
required: true
rubric:
  - Explains RAG correctly - retrieve relevant documents for the question, usually by embedding similarity search, then put them in the prompt so the language model answers from them.
  - Names the problem it solves, which is giving the model current or private knowledge and fewer made-up answers, without retraining it.
  - Names concrete failure modes, such as retrieval missing the right chunk, bad chunking, stale documents, or the model ignoring or contradicting the context.
  - Is honest about limits - RAG reduces but does not remove hallucination, and you must evaluate retrieval and answers separately.
