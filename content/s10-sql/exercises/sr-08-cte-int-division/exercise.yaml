title: "Read: CTE chain with integer division"
kind: explain
required: false
serves: [C6, C9]
kb: [sql-cte, sql-group-by]
rubric:
  - "Says what each clause does in order: per_city counts orders and cancellations per city, rates divides them, and the final SELECT filters and sorts."
  - "Predicts the result: zero rows, because every cancel_rate comes out as 0."
  - "Names the trap: n_cancelled and n_orders are both integers, so SQLite divides with integer division (1/3 is 0, 3/4 is 0); multiply by 1.0 or cast one side to REAL."
