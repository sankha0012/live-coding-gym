- id: rb4-c-21
  front: When would you use an idempotency key and what is the catch?
  back: 'Use it when a request may be repeated by retries, queues or double clicks and running it twice would do harm, such as a payment or an insert. The caller creates the key once and sends it on every retry. The catch: the lookup must be atomic (a unique constraint, not check then insert), and the same key with a different payload should raise an error instead of returning the old result.'
- id: rb4-c-22
  front: |-
    ```python
    conn.execute("INSERT OR IGNORE INTO events(id, payload) VALUES (?, ?)", (event_id, payload))
    ```

    What does this do?
  back: With a primary key or unique constraint on id, inserting an event that already exists does nothing, so a replayed message cannot create a duplicate row. The catch is that a second event with the same id but a different payload is also ignored silently.
