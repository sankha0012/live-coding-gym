- id: rb4-c-24
  front: |-
    ```python
    fd, tmp = tempfile.mkstemp(dir=folder)
    with os.fdopen(fd, "w") as f:
        f.write(text)
        f.flush()
        os.fsync(f.fileno())
    os.replace(tmp, path)
    ```

    What does this do?
  back: Writes the full content to a temporary file in the target folder, forces the bytes to disk, and swaps the file into place in one atomic step. A reader or a crash sees either the old file or the new one, never a partial file. A full version also deletes the temporary file on error.
