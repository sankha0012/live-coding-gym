- id: rb4-c-06
  front: |-
    ```python
    df.sort_values("score", ascending=False).head(3)
    ```

    What breaks here?
  back: The default sort algorithm in pandas is quicksort, which is not stable, so rows with equal scores may come out in any order. Sort by several columns, such as ["score", "id"], or pass kind="stable" and still make sure the input order is fixed.
- id: rb4-c-07
  front: |-
    ```python
    def is_expired(created, ttl=60, now=time.time()):
        return now - created > ttl
    ```

    What breaks here?
  back: The default value now=time.time() is evaluated once, when the function is defined, so every call uses the same frozen time. Use now=None and read the clock inside, or pass the time in as an argument.
