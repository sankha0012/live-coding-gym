- id: rb4-c-01
  front: |-
    ```python
    random.seed(0)
    shuffle_helper(rows)        # some library code also calls random.random()
    sample = random.sample(range(100), 5)
    ```

    What breaks here?
  back: random.seed sets the one global generator that every piece of code shares. If the helper draws a different number of values from it, the sample changes even though the seed did not. Use a local generator, random.Random(seed), created from a seed the caller passes in.
- id: rb4-c-02
  front: |-
    ```python
    def bucket(user_id):
        return hash(user_id) % 10
    ```

    What breaks here?
  back: The built-in hash of a string is randomised per process, so the same user lands in a different bucket after every restart or deploy. Use hashlib (for example md5 of the encoded id) when the value must be stable.
