- id: tw-assert-basic
  front: Testing · write a test that checks slugify("Hello World")
  back: |
    def test_slugify_words():
        assert slugify("Hello World") == "hello-world"
    # expected value written by hand, name says the behaviour
- id: tw-assert-approx
  front: Testing · compare floats in a test
  back: |
    import pytest
    assert sum([0.1, 0.2]) / 2 == pytest.approx(0.15)
    # never == on floats
- id: tw-assert-naming
  front: Testing · what makes pytest find a test?
  back: |
    File named test_*.py, function named test_*.
    Other names are silently ignored, so check the count in the summary.
- id: tw-parametrize
  front: Testing · run one test over many inputs
  back: |
    @pytest.mark.parametrize("x, expected", [(5, 5), (-1, 0), (11, 10)])
    def test_clamp(x, expected):
        assert clamp(x, 0, 10) == expected
- id: tw-parametrize-ids
  front: Testing · give parametrize rows readable names
  back: |
    @pytest.mark.parametrize("t, e", [("", ""), ("A B", "a-b")], ids=["empty", "two-words"])
- id: tw-raises
  front: Testing · assert that a call raises ValueError about funds
  back: |
    with pytest.raises(ValueError, match="insufficient"):
        withdraw(10, 50)
- id: tw-raises-narrow
  front: Testing · why not pytest.raises(Exception)?
  back: |
    It also passes for a typo that raises NameError.
    Use the exact type and add match=.
- id: tw-fixture
  front: Testing · share setup so each test gets fresh data
  back: |
    @pytest.fixture
    def scores():
        return [3, 1, 2]

    def test_x(scores):
        ...
- id: tw-fixture-yield
  front: Testing · fixture with cleanup after the test
  back: |
    @pytest.fixture
    def conn():
        c = open_conn()
        yield c
        c.close()   # runs even if the test failed
- id: tw-tmp-path
  front: Testing · write a file in a test without touching the disk for real
  back: |
    def test_save(tmp_path):
        p = tmp_path / "out.txt"
        p.write_text("hi")
        assert p.read_text() == "hi"
- id: tw-fake-clock-sleep
  front: Testing · test a retry without really sleeping
  back: |
    waits = []
    retry(fn, attempts=3, delay=1, sleep=waits.append)
    assert waits == [1, 2]
- id: tw-fake-clock-now
  front: Testing · test code that depends on "now"
  back: |
    def is_stale(ts, now):
        return now - ts > 3600
    assert is_stale(0, now=7200)
    # pass the time in, never read it inside
- id: tw-monkeypatch-setattr
  front: Testing · replace time.time for one test
  back: |
    def test_old(monkeypatch):
        monkeypatch.setattr(time, "time", lambda: 5000.0)
        assert age_label() == "old"
- id: tw-monkeypatch-env
  front: Testing · set an environment variable for one test
  back: |
    def test_env(monkeypatch):
        monkeypatch.setenv("MODE", "test")
        assert get_mode() == "test"
- id: tw-what-to-test
  front: Testing · three groups of tests to pick from
  back: |
    Behaviours: one test per sentence of the prompt.
    Edges: empty, one item, limit, duplicates, constant input.
    Failure paths: which error, and that the input is unchanged.
- id: tw-excinfo
  front: Testing · check the message of a raised error after the block
  back: |
    with pytest.raises(ValueError) as excinfo:
        withdraw(10, 50)
    assert "insufficient" in str(excinfo.value)
- id: tw-run-subset
  front: Testing · run one test, stop at first failure, show prints
  back: |
    uv run pytest test_x.py::test_name   # one test
    uv run pytest -x                     # stop at first failure
    uv run pytest -s                     # show print output
- id: tw-input-unchanged
  front: Testing · prove a function does not modify its input
  back: |
    data = [3, 1, 2]
    sorted_copy(data)
    assert data == [3, 1, 2]
- id: tw-determinism
  front: Testing · check a function is deterministic
  back: |
    assert predict(x, seed=0) == predict(x, seed=0)
    # same input, same seed, same output
- id: tw-conftest
  front: Testing · share a fixture across several test files
  back: |
    Put it in conftest.py next to the tests.
    Pytest finds it without an import.
- id: tw-monkeypatch-where
  front: Testing · patch sleep when the module did "from time import sleep"
  back: |
    monkeypatch.setattr(mymodule, "sleep", lambda s: None)
    # patch the name where it is looked up, not time.sleep
- id: tw-mutation-check
  front: Testing · how to check your tests are strong enough
  back: |
    Break the code on purpose (off-by-one, < for <=, drop the sort).
    If every test stays green, add a test that would go red.
