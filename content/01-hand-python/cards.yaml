- id: py1-memo-fib
  front: Fibonacci with a dict cache
  back: |
    def fib(n, cache=None):
        cache = {} if cache is None else cache
        if n < 2:
            return n
        if n not in cache:
            cache[n] = fib(n - 1, cache) + fib(n - 2, cache)
        return cache[n]
