- id: rt-complexity-words
  front: Routine · complexity to say aloud for one loop, a sort, nested loops, dict lookup
  back: |
    One loop: O(n).
    Sort: O(n log n).
    Nested loops: O(n squared).
    Dict or set lookup: O(1) on average.
- id: rt-step-clarify
  front: Routine step 1 · clarify (2 to 3 min), what do you ask?
  back: |
    Restate the task. Ask the five questions: input type and size,
    empty input, ties and duplicates, output type and order, limits.
    Write the answers as comments.
- id: rt-step-example
  front: Routine step 2 · tiny example (1 min), what do you do?
  back: |
    Pick an input of 3 to 5 items. Say the expected answer out loud
    and solve it by hand. Add one tricky item such as a tie.
- id: rt-step-plan
  front: Routine step 3 · plan (2 min), what does it look like?
  back: |
    Numbered comments, one per step, before any code:
    # 1. count words  # 2. sort by count then word  # 3. take k
    Say the complexity of the plan.
- id: rt-step-code
  front: Routine step 4 · code, how do you write it?
  back: |
    Small runnable pieces. Run every line or two, print the
    intermediate value. Talk while typing. Name things clearly.
- id: rt-step-test
  front: Routine step 5 · test (30 seconds), what do you run?
  back: |
    Say the expected value first. Run the tiny example, then one
    edge case (empty, one item, tie). Use assert. Say what matched.
- id: rt-step-improve
  front: Routine step 6 · improve, what do you say?
  back: |
    State time and space complexity, one trade-off, and one thing you
    would change with more time. Name what you did not test.
- id: rt-five-questions
  front: Routine · the five clarifying questions
  back: |
    1. Input type and size?  2. Empty or tiny input?
    3. Ties and duplicates?  4. Output type and order?
    5. Limits on time, memory, in-place?
- id: rt-stuck-recovery
  front: Routine · stuck, what do you do first?
  back: |
    Say you are stuck. Solve the tiny example by hand, write the slow
    correct version, then improve it. Ask for a hint after about 3 minutes.
