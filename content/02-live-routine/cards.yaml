- id: rt-two-pointers
  front: Routine · two pointers on a sorted list, find a pair with a given sum
  back: |
    lo, hi = 0, len(a) - 1
    while lo < hi:
        s = a[lo] + a[hi]
        if s == target:
            return lo, hi
        if s < target:
            lo += 1
        else:
            hi -= 1
    return None
- id: rt-sliding-window
  front: Routine · sliding window, longest substring without repeats
  back: |
    seen, left, best = {}, 0, 0
    for right, ch in enumerate(s):
        if ch in seen and seen[ch] >= left:
            left = seen[ch] + 1
        seen[ch] = right
        best = max(best, right - left + 1)
    return best
